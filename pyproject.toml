[project]
name = "temsai-asr-server"
version = "0.1.0"
description = "OpenAI/Whisper-compatible transcription server for NVIDIA Parakeet-TDT models (CPU and GPU)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = [
    "S603",  # subprocess with a fixed argv list (ffmpeg/ffprobe), no shell
    "S607",  # ffmpeg/ffprobe are resolved from PATH by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["asr_server", "conftest"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter declarations are evaluated once by design.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]
