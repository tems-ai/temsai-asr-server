# Image builds, natively on amd64 and arm64 runners (no QEMU); every image is
# smoke-tested with the real model before anything is pushed.
#   - push to main / pull request: CPU linux/amd64 only (fast check, nothing published);
#     on main the image is also Trivy-scanned (fails on fixable CRITICAL CVEs)
#   - "Run workflow" (workflow_dispatch): all six images, nothing published
#   - release tag v*.*.*: all six images, published to GHCR as multi-arch tags
#       :<version>-<variant>  :<major>.<minor>-<variant>  :<variant>  :latest (= cpu)
#     with <variant> = cpu | cuda12 | cuda13
name: Docker

# Only changes that affect the image trigger a build (docs, chart and test-only
# edits do not). Release tags always build: GitHub ignores path filters for tag
# pushes. Use "Run workflow" (workflow_dispatch) to force a rebuild.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements/runtime.txt
      - requirements/overrides.txt
      - asr_server/**
      - scripts/smoke_test.sh
      - .github/workflows/docker.yml
  pull_request:
    paths:  # keep in sync with push.paths
      - Dockerfile
      - .dockerignore
      - requirements/runtime.txt
      - requirements/overrides.txt
      - asr_server/**
      - scripts/smoke_test.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight build (six heavy jobs);
# release tag builds are never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.matrix.outputs.variants }}
      platforms: ${{ steps.matrix.outputs.platforms }}
      tags: ${{ steps.matrix.outputs.tags }}
    steps:
      - id: matrix
        env:
          FULL: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL" = "true" ]; then
            variants='[{"torch":"cpu","tag":"cpu"},{"torch":"cu126","tag":"cuda12"},{"torch":"cu130","tag":"cuda13"}]'
            platforms='[{"name":"linux/amd64","runner":"ubuntu-24.04","slug":"amd64"},{"name":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}]'
          else
            variants='[{"torch":"cpu","tag":"cpu"}]'
            platforms='[{"name":"linux/amd64","runner":"ubuntu-24.04","slug":"amd64"}]'
          fi
          {
            echo "variants=$variants"
            echo "platforms=$platforms"
            echo "tags=$(jq -c 'map(.tag)' <<< "$variants")"
          } >> "$GITHUB_OUTPUT"
          echo "variants: $variants"
          echo "platforms: $platforms"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Free disk space (CUDA images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform.name }}
          build-args: |
            TORCH_VARIANT=${{ matrix.variant.torch }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            IMAGE_LICENSE=Apache-2.0 AND LicenseRef-TemsAI-Commercial
            IMAGE_VENDOR=Tems.AI
          load: true
          tags: asr:test
          cache-from: type=gha,scope=${{ matrix.variant.tag }}-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.tag }}-${{ matrix.platform.slug }}

      # GitHub-hosted runners have no GPU: DEVICE=auto falls back to CPU, which
      # still proves the CUDA image's Python stack, NeMo and the model work.
      - name: Smoke test with the real model
        run: scripts/smoke_test.sh asr:test

      # Vulnerability gate on main (same policy as the Tems.AI platform scan):
      # HIGH and CRITICAL, unfixed ones ignored; fails only on a fixable
      # CRITICAL, HIGH findings are reported in the job summary + artifact.
      - name: Install Trivy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Trivy scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p trivy-reports
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --timeout 15m \
            --format json --output trivy-reports/asr-cpu-amd64.json asr:test
          trivy convert --format table trivy-reports/asr-cpu-amd64.json | tee trivy-reports/asr-cpu-amd64.txt
          report=trivy-reports/asr-cpu-amd64.json
          crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$report")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$report")
          {
            echo "## Trivy scan (cpu, linux/amd64)"
            echo ""
            echo "Severities: HIGH, CRITICAL (unfixed vulnerabilities ignored)."
            echo ""
            echo "| Critical | High |"
            echo "|---:|---:|"
            echo "| $crit | $high |"
            echo ""
            if [ "$high" -gt 0 ] || [ "$crit" -gt 0 ]; then
              echo "| Severity | Package | Installed | Fixed | ID |"
              echo "|---|---|---|---|---|"
              jq -r '.Results[]?.Vulnerabilities[]? | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.VulnerabilityID) |"' "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$crit" -gt 0 ]; then
            echo "::error::$crit fixable CRITICAL vulnerabilities — see the job summary and the trivy-report artifact"
            exit 1
          fi

      - name: Upload Trivy report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: github.ref_type == 'tag'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform.name }}
          build-args: |
            TORCH_VARIANT=${{ matrix.variant.torch }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            IMAGE_LICENSE=Apache-2.0 AND LicenseRef-TemsAI-Commercial
            IMAGE_VENDOR=Tems.AI
          cache-from: type=gha,scope=${{ matrix.variant.tag }}-${{ matrix.platform.slug }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.ref_type == 'tag'
        env:
          digest: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: digests-${{ matrix.variant.tag }}-${{ matrix.platform.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref_type == 'tag'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.tags) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}-${{ matrix.variant }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && matrix.variant == 'cpu' }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
