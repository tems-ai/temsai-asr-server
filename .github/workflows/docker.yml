# Image builds, natively on amd64 and arm64 runners (no QEMU); every image is
# smoke-tested with the real model before anything is pushed.
#   - push to main / pull request: CPU linux/amd64 only (fast check, nothing published)
#   - "Run workflow" (workflow_dispatch): all six images, nothing published
#   - release tag v*.*.*: all six images, published to GHCR as multi-arch tags
#       :<version>-<variant>  :<major>.<minor>-<variant>  :<variant>  :latest (= cpu)
#     with <variant> = cpu | cuda12 | cuda13
name: Docker

# Only changes that affect the image trigger a build (docs, chart and test-only
# edits do not). Release tags always build: GitHub ignores path filters for tag
# pushes. Use "Run workflow" (workflow_dispatch) to force a rebuild.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements/runtime.txt
      - asr_server/**
      - scripts/smoke_test.sh
      - .github/workflows/docker.yml
  pull_request:
    paths:  # keep in sync with push.paths
      - Dockerfile
      - .dockerignore
      - requirements/runtime.txt
      - asr_server/**
      - scripts/smoke_test.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight build (six heavy jobs);
# release tag builds are never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.matrix.outputs.variants }}
      platforms: ${{ steps.matrix.outputs.platforms }}
      tags: ${{ steps.matrix.outputs.tags }}
    steps:
      - id: matrix
        env:
          FULL: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL" = "true" ]; then
            variants='[{"torch":"cpu","tag":"cpu"},{"torch":"cu126","tag":"cuda12"},{"torch":"cu130","tag":"cuda13"}]'
            platforms='[{"name":"linux/amd64","runner":"ubuntu-24.04","slug":"amd64"},{"name":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}]'
          else
            variants='[{"torch":"cpu","tag":"cpu"}]'
            platforms='[{"name":"linux/amd64","runner":"ubuntu-24.04","slug":"amd64"}]'
          fi
          {
            echo "variants=$variants"
            echo "platforms=$platforms"
            echo "tags=$(jq -c 'map(.tag)' <<< "$variants")"
          } >> "$GITHUB_OUTPUT"
          echo "variants: $variants"
          echo "platforms: $platforms"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (CUDA images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform.name }}
          build-args: |
            TORCH_VARIANT=${{ matrix.variant.torch }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          load: true
          tags: asr:test
          cache-from: type=gha,scope=${{ matrix.variant.tag }}-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.tag }}-${{ matrix.platform.slug }}

      # GitHub-hosted runners have no GPU: DEVICE=auto falls back to CPU, which
      # still proves the CUDA image's Python stack, NeMo and the model work.
      - name: Smoke test with the real model
        run: scripts/smoke_test.sh asr:test

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: github.ref_type == 'tag'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform.name }}
          build-args: |
            TORCH_VARIANT=${{ matrix.variant.torch }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant.tag }}-${{ matrix.platform.slug }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: digests-${{ matrix.variant.tag }}-${{ matrix.platform.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref_type == 'tag'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.tags) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}-${{ matrix.variant }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && matrix.variant == 'cpu' }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
