name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Install kubeconform
        # sha256 from the release's CHECKSUMS file; a swapped release asset fails here.
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz" \
            | sha256sum -c -
          sudo tar xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Lint chart
        run: |
          chart=deploy/helm/temsai-asr-server
          helm lint "$chart"
          helm lint "$chart" -f "$chart/values-gpu.yaml"
          helm template t "$chart" | kubeconform -strict -summary -
          helm template t "$chart" -f "$chart/values-gpu.yaml" | kubeconform -strict -summary -
          helm template t "$chart" --set apiKey.value=x,ingress.enabled=true,persistence.enabled=false,replicaCount=2 \
            | kubeconform -strict -summary -
      - name: Plain manifests are in sync with the chart
        run: |
          scripts/render-manifests.sh
          git diff --exit-code deploy/kubernetes/
          kubeconform -strict -summary deploy/kubernetes/

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: docker compose -f compose.yaml config -q
      - run: docker compose -f compose.yaml -f compose.gpu.yaml config -q

  dockerfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: apt packages are unpinned on purpose (slim base security updates).
          # DL3013: pip versions are pinned in requirements files, not inline.
          ignore: DL3008,DL3013
