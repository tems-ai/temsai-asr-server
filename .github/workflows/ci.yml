name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: Lint chart
        run: |
          chart=deploy/helm/temsai-asr-server
          helm lint "$chart"
          helm lint "$chart" -f "$chart/values-gpu.yaml"
          helm template t "$chart" | kubeconform -strict -summary -
          helm template t "$chart" -f "$chart/values-gpu.yaml" | kubeconform -strict -summary -
          helm template t "$chart" --set apiKey.value=x,ingress.enabled=true,persistence.enabled=false,replicaCount=2 \
            | kubeconform -strict -summary -
      - name: Plain manifests are in sync with the chart
        run: |
          scripts/render-manifests.sh
          git diff --exit-code deploy/kubernetes/
          kubeconform -strict -summary deploy/kubernetes/

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f compose.yaml config -q
      - run: docker compose -f compose.yaml -f compose.gpu.yaml config -q

  dockerfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: apt packages are unpinned on purpose (slim base security updates).
          # DL3013: pip versions are pinned in requirements files, not inline.
          ignore: DL3008,DL3013
